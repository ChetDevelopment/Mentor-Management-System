name: Auto-merge to Develop

on:
  workflow_dispatch:
    inputs:
      source-branch:
        description: "Branch to merge into Develop"
        required: true
        type: string
        default: ""

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge ${{ github.event.inputs.source-branch }} into Develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin Develop
          git fetch origin ${{ github.event.inputs.source-branch }}
          git checkout Develop
          git merge origin/${{ github.event.inputs.source-branch }} --no-edit
          git push origin Develop
